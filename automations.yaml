#
# AR-S3f playtest (2026-05-14): the `synthetic-cron-smoke-test` entry
# was added here, exercised through success + failure + escalator dedup,
# and removed. Evidence:
#   - wiki/playtests/AR-S3f-2026-05-14-cron-smoke.md
#   - data/playtest-evidence/AR-S3f-cron-smoke/

schema_version: 1

automations:
  # AR-S3e (2026-05-14, Frugality reframe): catalog-only entry for the
  # existing Windows schtask "Dream Auto". The registry does NOT manage
  # this entry's lifecycle -- the schtask is owned by Dream and was the
  # de-facto parallel-autopilot identified in
  # pipeline-dashboard/docs/audits/2026-05-13-parallel-autopilot-investigation.md.
  # `external: true` makes the cron_handler skip install / reinstall /
  # uninstall while keeping the entry visible in GET /api/registry/cron.
  - name: dream-auto
    description: |
      Dream's 30-minute autopilot. Spawns a fresh subprocess via
      spawn-swarm.py each fire so quota / context state is reset. Owned
      by the Windows schtask of the same name; registry observes only.
    owner_project: dream
    target: dream/orchestrator.py:run_auto
    target_kind: python_callable
    mechanism: cron
    schedule: PT30M
    external: true
    enabled: true
    escalation:
      channel: log_only
      on_failure: log_only
    tags:
      - autopilot
      - external
